version: '3.8'

services:
  db:
    image: docker.io/library/mariadb:10.11
    container_name: dinelogiq_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: dinelogiq
      MYSQL_USER: dinelogiq_user
      MYSQL_PASSWORD: secretpassword
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  app:
    image: docker.io/bitnami/laravel:latest
    container_name: dinelogiq_app
    ports:
      - "8000:8000"
    volumes:
      - .:/app:z
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=dinelogiq
      - DB_USERNAME=dinelogiq_user
      - DB_PASSWORD=secretpassword
    depends_on:
      - db
    command: >
      sh -c "composer install --no-interaction &&
             npm install &&
             npm run build &&
             php artisan key:generate &&
             php artisan migrate --force &&
             php artisan serve --host=0.0.0.0 --port=8000"

  phpmyadmin:
    image: docker.io/phpmyadmin/phpmyadmin
    container_name: dinelogiq_phpmyadmin
    restart: always
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
      UPLOAD_LIMIT: 100M
    ports:
      - "8080:80"
    depends_on:
      - db

  # TAMBAHKAN INI ↓
  webserver:
    image: docker.io/httpd:latest
    container_name: dinelogiq_webserver
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./httpd.conf:/usr/local/apache2/conf/httpd.conf:ro
    depends_on:
      - phpmyadmin

volumes:
  db_data: